name: Test and deploy Jannet
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jannet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q
        env:
          DATABASE_PATH: /tmp/jannet-ci.sqlite3
      - run: bash -n deploy/ci/deploy-release.sh
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.AWS_DEPLOY_DOCUMENT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: github-${{ github.run_id }}
      - run: python3 deploy/ci/run-deploy.py
      - name: Check public HTTPS
        run: curl --fail --silent --show-error --retry 3 https://13.126.21.12/api/config
